{% extends "base.html" %}
{% set base = "../" %}
{% block title %}{{ page.title }} — {{ forum.name }}{% endblock %}
{% block content %}
<article data-pagefind-body data-pagefind-filter="kind:{{ page.kind }}">
  <nav class="crumbs">
    <a href="../pages.html">Articles &amp; Wiki</a> <span>›</span>
    <span data-pagefind-meta="title">{{ page.title }}</span>
  </nav>
  <h1 class="thread-title">{{ page.title }}</h1>
  {% if page.author %}<p class="orig">by {{ page.author }}</p>{% endif %}
  <div class="post-body page-body">{{ page.body_html | safe }}</div>
</article>
{% endblock %}
