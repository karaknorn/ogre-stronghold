name: "📏 House Rules & Homebrew"
description: A new unit, special character, or scenario idea. (Mirrors "House Rules".)
title: "[House Rule] "
labels: ["house-rules"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: The unit / character / scenario's name
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: The rules
      description: Stats, special rules, points cost, restrictions...
      render: text
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Design reasoning (optional)
      placeholder: What gap this fills, what it's balanced against...
    validations:
      required: false
